      - name: Build APK
        working-directory: src
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: cp src/app/build/outputs/apk/release/app-release.apk OZM-Triage.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OZM-Triage-apk
          path: OZM-Triage.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ОЗМ-Триаж 1.0 (сборка ${{ github.run_number }})
          body: Скачайте OZM-Triage.apk ниже и установите на Android 8.0+.
          files: OZM-Triage.apk
